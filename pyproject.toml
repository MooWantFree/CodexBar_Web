[project]
name = "codex-token-report"
version = "0.5.0"
description = "Private local dashboard for Codex token usage and price estimates"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
dependencies = [
    "fastapi>=0.116,<1",
    "httpx>=0.28,<1",
    "jinja2>=3.1,<4",
    "tzdata>=2026.1",
    "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
desktop = ["pywebview>=6.1,<7"]
dev = [
    "pytest>=8.4,<9",
    "ruff>=0.12,<1",
]

[project.scripts]
codex-token-report = "codex_token_report.cli:main"
codex-token-report-desktop = "codex_token_report.desktop:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codex_token_report"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".uv-cache", ".venv"]
