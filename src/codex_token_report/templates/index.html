<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>Codex Token Report</title>
    <link rel="stylesheet" href="{{ url_for('static', path='webui/styles.css') }}?v={{ styles_version }}">
  </head>
  <body
    data-default-start="{{ default_start }}"
    data-default-end="{{ default_end }}"
    data-minimum-date="{{ minimum_date }}"
    data-maximum-date="{{ maximum_date }}"
    data-timezone="{{ timezone }}"
    data-codex-home="{{ codex_home }}"
  >
    <div id="root"></div>
    <noscript>Codex Report requires JavaScript.</noscript>
    <script type="module" src="{{ url_for('static', path='webui/app.js') }}?v={{ app_version }}"></script>
  </body>
</html>
